# Stack agrupado por áreas. Se muestra como chips, sin niveles ni porcentajes.
# icon (opcional): network | server | shield | cloud | code | terminal
# Cada elemento puede ser un texto (igual en ambos idiomas) o { es: …, en: … }.
# Pon solo lo que puedas defender en una entrevista técnica.
# Fuente: tu CV y las aptitudes de LinkedIn.

groups:
  - area: { es: Redes, en: Networking }
    icon: network
    items:
      - TCP/IP · DNS · NAT
      - SD-WAN
      - { es: "VPN site-to-site", en: "Site-to-site VPN" }
      - { es: "Firewalls FortiGate, Sophos y Huawei", en: "FortiGate, Sophos & Huawei firewalls" }
      - { es: "Wi-Fi empresarial (Huawei iMaster NCE)", en: "Enterprise Wi-Fi (Huawei iMaster NCE)" }
      - VoIP (FreePBX/Asterisk, Grandstream)

  - area: { es: Sistemas, en: Systems }
    icon: server
    items:
      - Microsoft 365 / Exchange Online
      - Active Directory
      - Proxmox
      - VMware vSphere
      - Linux
      - PowerShell
      - { es: "Monitorización (CheckMK, Zabbix)", en: "Monitoring (CheckMK, Zabbix)" }

  - area: { es: Ciberseguridad, en: Cybersecurity }
    icon: shield
    items:
      - { es: "Blue Team y seguridad operacional", en: "Blue Team & security operations" }
      - { es: "SGSI (ISO 27001 / 27002)", en: "ISMS (ISO 27001 / 27002)" }
      - { es: "Gestión de vulnerabilidades y riesgos", en: "Vulnerability & risk management" }
      - SIEM · EDR / XDR
      - Barracuda Email Security Gateway
      - Pentesting (eJPTv2)
      - Kali Linux

  - area: { es: "Cloud, automatización y programación", en: "Cloud, automation & programming" }
    icon: cloud
    items:
      - { es: "Fundamentos de Cloud (ICCA)", en: "Cloud fundamentals (ICCA)" }
      - Docker
      - { es: "Automatización de flujos con IA", en: "AI workflow automation" }
      - Python
      - C# / .NET
      - Java
      - JavaScript
