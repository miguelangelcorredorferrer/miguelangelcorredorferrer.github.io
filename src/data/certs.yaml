# Certificaciones.
#   status: obtained | in-progress | planned
#   date / expires: "AAAA" o "AAAA-MM" (entre comillas). En in-progress, date es la fecha prevista (opcional).
#   credentialUrl: enlace de verificación (opcional). Cópialo desde el certificado en LinkedIn o INE.
#   badge: nombre de archivo dentro de src/assets/badges/ (opcional; png, jpg, webp o svg).
# Las `planned` no se muestran salvo que showPlanned sea true.

showPlanned: false

certs:
  - name: eJPTv2 — Junior Penetration Tester
    issuer: INE Security
    status: obtained
    date: "2025-10"
    expires: "2028-10"

  - name: ICCA — INE Certified Cloud Associate
    issuer: INE Security
    status: obtained
    date: "2025-10"
    expires: "2028-10"
