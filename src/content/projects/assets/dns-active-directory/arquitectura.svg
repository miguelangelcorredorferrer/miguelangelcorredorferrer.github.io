<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 260" width="720" height="260" role="img" aria-labelledby="t">
  <title id="t">DNS client → private DNS server (prueba.local zones) → firewall → public DNS server</title>
  <rect width="720" height="260" rx="12" fill="#f5f6f8"/>
  <g font-family="ui-monospace, Menlo, Consolas, monospace" font-size="14" fill="#1d232b" text-anchor="middle">
    <g fill="none" stroke="#5b6573" stroke-width="1.5">
      <rect x="20" y="95" width="120" height="60" rx="8"/>
      <rect x="215" y="60" width="180" height="130" rx="8"/>
      <rect x="450" y="95" width="100" height="60" rx="8"/>
      <rect x="595" y="95" width="105" height="60" rx="8"/>
      <rect x="230" y="115" width="150" height="26" rx="5"/>
      <rect x="230" y="148" width="150" height="26" rx="5"/>
      <path d="M140 125h67M395 125h47M550 125h37"/>
      <path d="M199 119l8 6-8 6M434 119l8 6-8 6M579 119l8 6-8 6"/>
    </g>
    <text x="80" y="121">Client</text>
    <text x="80" y="140" font-size="12" fill="#5b6573">DNS client</text>
    <text x="305" y="83">Private DNS</text>
    <text x="305" y="103" font-size="12" fill="#5b6573">Windows Server</text>
    <text x="305" y="133" font-size="12">A · prueba.local</text>
    <text x="305" y="166" font-size="12">PTR · 3.168.192</text>
    <text x="500" y="121">Firewall</text>
    <text x="647" y="121">Public</text>
    <text x="647" y="140">DNS</text>
    <text x="500" y="190" font-size="12" fill="#5b6573">Forwarders</text>
    <text x="360" y="235" font-size="12" fill="#5b6573">The client never talks to the public DNS directly</text>
  </g>
</svg>
